<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informatik-Quiz Klasse 10</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="quiz-container">
    <h1>💻 Informatik-Quiz</h1>
    
    <div id="game-ui">
        <div class="stats">
            <span>Frage: <span id="current-num">1</span>/10</span>
            <span>Score: <span id="score">0</span></span>
        </div>

        <div class="question-box">
            <p id="question-text">Lädt Frage...</p>
            <input type="text" id="user-input" placeholder="Deine Antwort..." autocomplete="off">
            <br>
            <button id="submit-btn">Antworten</button>
        </div>

        <div id="feedback"></div>
    </div>

    <div id="result-ui" class="hidden">
        <h2>Quiz beendet!</h2>
        <p id="final-score"></p>
        <button onclick="location.reload()">Nochmal versuchen</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
